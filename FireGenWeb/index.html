<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Incidents</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Active Incidents</h1>
    <div class="meta">
      <span id="count">0 incidents</span>
      <span id="updated">Loading…</span>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <main>
    <table id="incidents">
      <thead>
        <tr>
          <th>Time</th>
          <th>Incident</th>
          <th>Location</th>
          <th>Units</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No active incidents.</p>
  </main>

  <div id="detail" class="overlay" hidden></div>

  <script src="app.js"></script>
</body>
</html>
